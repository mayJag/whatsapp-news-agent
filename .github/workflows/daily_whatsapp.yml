name: Daily WhatsApp News Agent

on:
  repository_dispatch:
    types: [send_news]
  workflow_dispatch:

jobs:
  send_news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Vertex AI service-account key
        run: echo '${{ secrets.VERTEX_KEY_JSON }}' > vertex-key.json

      - name: Run WhatsApp News Agent
        env:
          GOOGLE_APPLICATION_CREDENTIALS: vertex-key.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE_NAME: ${{ secrets.WA_TEMPLATE_NAME }}
          WA_TEMPLATE_LANG: ${{ secrets.WA_TEMPLATE_LANG }}
        run: python main.py
